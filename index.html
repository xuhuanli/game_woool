<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>修仙传奇</title>
    <style>
      /* 启动页在脚本加载前就要显示，所以直接写在这里 */
      body { margin: 0; background: #17140f; }
      #boot { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; color: #a79c84; font: 15px "PingFang SC", "Microsoft YaHei", sans-serif; }
      #boot h1 { margin: 0; font-size: 28px; color: #f0cf7a; letter-spacing: 6px; }
      #boot p { margin: 0; }
      #boot.failed p { color: #ff8a7a; }
      #boot pre { max-width: min(720px, 90vw); max-height: 50vh; overflow: auto; margin: 0; padding: 10px 12px;
        color: #efe6d0; white-space: pre-wrap; background: #241d12; border: 1px solid #6b5630; border-radius: 6px; }
      #boot button { padding: 4px 16px; color: #efe6d0; cursor: pointer; background: #3b3020;
        border: 1px solid #6b5630; border-radius: 4px; font: inherit; }
    </style>
  </head>
  <body>
    <div id="boot"><h1>修仙传奇</h1><p>加载中…</p></div>
    <div id="game"></div>
    <div id="hud" hidden>
      <section class="status">
        <div class="status-title"><span id="hud-name"></span></div>
        <div class="status-row"><span id="hud-class"></span> · <b id="hud-realm"></b></div>
        <div class="bar hp"><i id="hud-hp-fill"></i><span id="hud-hp-text"></span></div>
        <div class="bar mp"><i id="hud-mp-fill"></i><span id="hud-mp-text"></span></div>
        <div class="bar exp"><i id="hud-exp-fill"></i><span id="hud-exp-text"></span></div>
        <div class="status-row"><span id="hud-stat-name"></span> <b id="hud-attack"></b> · 灵石 <b id="hud-gold"></b></div>
        <div class="status-row">法器 <b id="hud-weapon"></b></div>
        <div class="status-menu">
          <button id="hud-open-character">角色 C</button>
          <button id="hud-open-bag">背包 B</button>
          <button id="hud-open-skills">功法 K</button>
          <button id="hud-open-auto">挂机 A</button>
          <button id="hud-open-codex">图鉴 J</button>
          <button id="hud-open-garden">药园 G</button>
          <i class="menu-break"></i>
          <button id="hud-open-settings">设置 O</button>
          <button id="hud-open-save">存档</button>
        </div>
      </section>
      <section class="minimap"><div id="hud-map-name"></div><canvas id="hud-minimap"></canvas></section>
      <section class="quests" id="hud-quests"></section>
      <section class="boss" id="hud-boss" hidden>
        <div id="hud-boss-name"></div>
        <div class="bar hp"><i id="hud-boss-fill"></i></div>
      </section>
      <section class="auto-status" id="hud-auto" hidden></section>
      <section class="hotbar" id="hud-hotbar"></section>
      <section class="log" id="hud-log"></section>
      <section class="help">左键走路，右键跑步，按住持续移动，点怪攻击，空格捡法器，C 角色，B 背包，K 功法，A 挂机，J 图鉴，G 药园，O 设置，M 静音，点任务自动寻路</section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
